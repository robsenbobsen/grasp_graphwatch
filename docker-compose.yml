# Full GRASP stack. Everything (project, services, containers, image, network,
# volume) is named with the `doc-comp_` / `doc-comp` prefix.
#
#   cp .env.docker.example .env.docker          # once, then adjust (GRASP_API_KEY!)
#   docker compose build
#   docker compose up -d                        # detection API + workbench (DB from .env.docker)
#   docker compose --profile db up -d           # ... plus the bundled doc-comp_postgres
#   curl localhost:8000/docs                    # API docs; jobs need the X-API-Key header
#   docker compose --profile cli run --rm doc-comp_grasp      # full pipeline via main.py
#   docker compose --profile pipeline run --rm doc-comp_sysdig_pipeline
#
# The detection services use all NVIDIA GPUs (needs the NVIDIA Container Toolkit).
# See README's "Docker" section for details (loading PIDSMaker dumps, external DB).

name: doc-comp

x-detection-service: &detection-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      TORCH_VARIANT: ${TORCH_VARIANT:-cu129}
  image: doc-comp_grasp:latest
  env_file:
    - .env.docker
  # Run as the host user so files written to the bind-mounted repo (data/, pids_runs/, ...)
  # are not root-owned. Export HOST_UID/HOST_GID in your shell if they differ from 1000.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - .:/detection_service
  working_dir: /detection_service
  networks:
    - doc-comp_net
  # Lets db_host=host.docker.internal reach a DB on the host (Linux too).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  doc-comp_postgres:
    image: postgres:17
    container_name: doc-comp_postgres
    restart: unless-stopped
    # Optional: only started with `--profile db`. By default the services use the database
    # configured in .env.docker (db_host/db_port/...), e.g. an existing remote Postgres.
    profiles: ["db"]
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (applied when the volume is first
    # initialized) and POSTGRES_DATABASES come from .env.docker.
    env_file:
      - .env.docker
    ports:
      - "${POSTGRES_PORT:-18888}:5432"
    volumes:
      - doc-comp_postgres_data:/var/lib/postgresql/data
      # PIDSMaker .dump files to pg_restore from (see README "Docker").
      - ${DUMPS_DIR:-./db_setup/dumps}:/dumps:ro
    networks:
      - doc-comp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-off: creates the databases listed in POSTGRES_DATABASES (.env.docker) that do not
  # exist yet, on every `docker compose --profile db up`, then exits.
  doc-comp_postgres_init:
    image: postgres:17
    container_name: doc-comp_postgres_init
    profiles: ["db"]
    env_file:
      - .env.docker
    volumes:
      - ./db_setup/create_databases.sh:/create_databases.sh:ro
    entrypoint: ["sh", "/create_databases.sh"]
    networks:
      - doc-comp_net
    depends_on:
      doc-comp_postgres:
        condition: service_healthy
    restart: "no"

  # REST API: queues training/inference jobs (train.py / infer.py) and serves results.
  doc-comp_detection_api:
    <<: *detection-service
    container_name: doc-comp_detection_api
    restart: unless-stopped
    depends_on:
      doc-comp_postgres:
        condition: service_healthy
        required: false  # only when started with --profile db
      doc-comp_postgres_init:
        condition: service_completed_successfully
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "detection_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Full pipeline in one go via main.py (manual runs; the API is the default entry point).
  doc-comp_grasp:
    <<: *detection-service
    container_name: doc-comp_grasp
    profiles: ["cli"]
    depends_on:
      doc-comp_postgres:
        condition: service_healthy
        required: false  # only when started with --profile db
      doc-comp_postgres_init:
        condition: service_completed_successfully
        required: false
    command:
      - python
      - main.py
      - --experiment-config
      - ${GRASP_EXPERIMENT_CONFIG:-grasp/experiments/all_experiments/cadets_e3_default/experiment_cadets_e3.yaml}

  doc-comp_workbench:
    <<: *detection-service
    container_name: doc-comp_workbench
    restart: unless-stopped
    ports:
      - "${WORKBENCH_PORT:-8501}:8501"
    command:
      - streamlit
      - run
      - grasp_contextualization/pids_workbench_app.py
      - --server.address=0.0.0.0
      - --server.headless=true

  # GRASP GraphWatch console: interactive front end for the REST API (all features), links
  # to the workbench. Only with `--profile console`; needs no GPU.
  doc-comp_console:
    image: doc-comp_grasp:latest
    container_name: doc-comp_console
    profiles: ["console"]
    restart: unless-stopped
    env_file:
      - .env.docker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/detection_service
    working_dir: /detection_service
    networks:
      - doc-comp_net
    depends_on:
      doc-comp_detection_api:
        condition: service_healthy
    environment:
      GRASP_API_URL: http://doc-comp_detection_api:8000
      # host ports, for links opened in the browser (same host as the console)
      API_PORT: ${API_PORT:-8000}
      WORKBENCH_PORT: ${WORKBENCH_PORT:-8501}
    ports:
      - "${CONSOLE_PORT:-8502}:8501"
    command:
      - streamlit
      - run
      - graphwatch_console/app.py
      - --server.address=0.0.0.0
      - --server.headless=true

  # Converts .scap captures in graphwatch_data_pipeline/sysdig/input/sysdig_scaps
  # and uploads them into doc-comp_postgres. Only started on demand.
  doc-comp_sysdig_pipeline:
    <<: *detection-service
    container_name: doc-comp_sysdig_pipeline
    profiles: ["pipeline"]
    depends_on:
      doc-comp_postgres:
        condition: service_healthy
        required: false  # only when started with --profile db
      doc-comp_postgres_init:
        condition: service_completed_successfully
        required: false
    command: ["python", "graphwatch_data_pipeline/sysdig/main.py"]

networks:
  doc-comp_net:
    name: doc-comp_net

volumes:
  doc-comp_postgres_data:
    name: doc-comp_postgres_data
