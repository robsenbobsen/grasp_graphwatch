dataset:
  name: sysdig
experiment_prefix: sysdig_4
storage:
  graph_root_dir: ./data/graphs/sysdig
graph_management:
  force_reload: false
ground_truth:
  base_dir: ./ground_truth/atlasv2_edr
times:
  train_start: ["2026-08-06 07:00:00"]
  # train_end: ["2026-08-05 23:59:59"] 
  # test_start: ["2026-08-05 00:00:00"]
  train_end: ["2026-08-06 23:59:59"] 
  test_start: ["2026-08-07 00:00:00"]
  test_end: ["2026-08-07 9:00:00"]
  context_size: 30 # in minutes
  step_size: 30 # in minutes 
location_transformer:
  max_location_length: 100 
  hidden_dim: 16
  embedding_dim: 8 
  num_layers: 2
  nhead: 4
  num_epochs: 4
  patience: 3
  batch_size: 256
  positional_encoding_max_len: 5000
  positional_encoding_div_term_hyperparam: 10000.0
  learning_rate: 0.001
  device: cuda:1
detection:
  num_neighbors: [-1,-1]
  batch_size: 32
  epochs: 4
  device: cuda:1
  learning_rate: 0.01
  hidden_dim: 128
  heads: 4
  num_layers: 2
  dropout: 0.1
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_mode: min
  shuffle_train_paths: true
  shuffle_train_batches: true
attack_windows_for_visualization:
  - start_time: "2026-08-07 06:00:00"
    end_time: "2026-08-07 06:00:00"
