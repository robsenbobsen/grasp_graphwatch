dataset:
  name: sysdig
experiment_prefix: sysdig_cinito_getrect_3
storage:
  graph_root_dir: ./data/graphs/sysdig_getrect
graph_management:
  force_reload: false
ground_truth:
  base_dir: ./ground_truth/atlasv2_edr
times:
  train_start: ["2026-09-09 08:00:00"] #2026-09-09 08:37:51.515032791 UTC
  # train_start: ["2026-08-17 00:00:00"]
  # train_end: ["2026-06-11 7:59:59"] # 2026-06-11 12:16:48
  train_end: ["2026-09-09 23:59:59"] # 2026-06-11 12:16:48
  test_start: ["2026-09-10 00:00:00"]
  test_end: ["2026-09-10 06:59:59"] # 2026-09-10 06:35:33.129590278 UTC
  context_size: 30 # in minutes
  step_size: 30 # in minutes 
location_transformer:
  max_location_length: 100 
  hidden_dim: 16
  embedding_dim: 8 
  num_layers: 2
  nhead: 4
  num_epochs: 4
  patience: 3
  batch_size: 256
  positional_encoding_max_len: 5000
  positional_encoding_div_term_hyperparam: 10000.0
  learning_rate: 0.001
  device: cuda:1
detection:
  num_neighbors: [10000,40]
  batch_size: 32
  epochs: 4
  device: cuda:1
  learning_rate: 0.01
  hidden_dim: 128
  heads: 4
  num_layers: 2
  dropout: 0.1
  weight_decay: 0.0001
  scheduler_factor: 0.5
  scheduler_patience: 5
  scheduler_mode: min
  shuffle_train_paths: true
  shuffle_train_batches: true
attack_windows_for_visualization:
  - start_time: "2026-06-23 12:00:00"
    end_time: "2026-06-23 12:30:00"